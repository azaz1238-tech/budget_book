<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가계부</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="title-row">
        <h1>가계부</h1>
        <nav id="tab-bar" class="tab-bar" role="tablist" aria-label="화면 선택"></nav>
      </div>
      <div class="month-controls">
        <div id="month-navigator" class="month-navigator"></div>
        <div id="month-selector" class="month-selector" hidden></div>
      </div>
      <section id="summary-panel" aria-label="월별 요약"></section>
    </div>
  </header>
  <main class="app">
    <div id="panel-list">
      <section id="transaction-list" class="card" aria-label="거래 내역"></section>
    </div>
    <div id="panel-stats" hidden>
      <section id="category-spending" class="card" aria-label="분류별 지출"></section>
    </div>
    <div id="panel-settings" hidden>
      <section id="category-manager" class="card" aria-label="분류 관리"></section>
      <section id="recurring-manager" class="card" aria-label="고정 거래"></section>
      <section id="data-manager" class="card" aria-label="데이터"></section>
    </div>
  </main>
  <button type="button" id="add-button" class="button-primary add-button">+ 추가</button>
  <dialog id="transaction-dialog" class="sheet-dialog" aria-label="거래 입력">
    <div id="transaction-form"></div>
  </dialog>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-label="확인"></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
